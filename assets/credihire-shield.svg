<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Shield -->
  <path d="M32 6 L52 14 C52 34 44 48 32 58 C20 48 12 34 12 14 Z"
        stroke="url(#neonGlow)" stroke-width="2.5" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Cyber Grid Accent Lines -->
  <path d="M22 22 L42 22" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
  <path d="M19 32 L45 32" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
  <path d="M24 42 L40 42" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="32" y1="14" x2="32" y2="52" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Shield Core Cyber Lock / Check Emblem -->
  <path d="M24 33 L29 38 L41 26"
        stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Circuit Nodes -->
  <circle cx="32" cy="14" r="2" fill="#00f2fe" />
  <circle cx="24" cy="33" r="2" fill="#00f2fe" />
  <circle cx="41" cy="26" r="2" fill="#00f2fe" />
</svg>
